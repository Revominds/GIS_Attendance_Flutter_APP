name: gis_attendance
description: GIS Staff Attendance System
publish_to: 'none'
version: 1.0.9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  local_auth: ^2.3.0
  image_picker:
  shared_preferences:
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_commons: ^0.13.0
  path_provider: ^2.1.1
  provider: ^6.1.5+1
  device_preview: ^1.2.0
  flutter_dotenv: ^6.0.0 # Add this line
  file_picker: ^13.1.0
  flutter_local_notifications: ^17.1.0
  webview_flutter: ^4.7.0
  camera: ^0.12.1
  supabase_flutter: ^2.9.1
  pdf: ^3.11.1
  printing: ^5.14.2
  share_plus: ^13.3.1
  open_filex: ^4.4.0
  package_info_plus:
  google_fonts: ^6.2.1
  # Used directly by attendance_history_screen.dart (DateFormat) — was
  # previously resolving only as a transitive dep of other packages, so
  # it worked by luck rather than by being declared.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ghana_immigration_attendance_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/ghana_immigration_attendance_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/default_avatar.png
    - assets/login.png
    - assets/register.png
    - assets/ghana_immigration_attendance_logo.png
    - .env

#No fragment activity Local Auth plugin require activity to be a FragmentActivity , null, null
#